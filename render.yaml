# Render blueprint. In Render: New -> Blueprint -> connect this repo.
# The persistent disk is the important part: without it, every deploy wipes
# your customers and bookings.
services:
  - type: web
    name: tampa-maids-cleaning
    runtime: docker
    plan: starter                 # free tier has no persistent disk — do not use it
    # Cheap, logs nothing, touches neither the config nor the disk. Keep this in
    # step with the Health Check Path field in the Render dashboard, which wins
    # for a service that was not created from this blueprint.
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "1"
      - key: OWNER_EMAIL
        sync: false               # set these in the Render dashboard, not here
      - key: OWNER_PASSWORD
        sync: false
      # Payments and phone alerts: see ops/run-it-from-your-phone.md
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: OWNER_SMS_EMAIL
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: GOOGLE_TAG_ID
        sync: false
      - key: GOOGLE_ADS_ID
        sync: false
      - key: GOOGLE_ADS_LEAD_LABEL
        sync: false
      - key: GOOGLE_ADS_PURCHASE_LABEL
        sync: false
      - key: META_CAPI_TOKEN
        sync: false
      - key: GA_API_SECRET
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
